name: Hourly Bus Check
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        run: python tracker.py

      - name: Save results
        run: |
          git config --global user.name 'BusTrackerBot'
          git config --global user.email 'bot@noreply.github.com'
          git add roster.json
          git commit -m "Update bus roster" || exit 0
          git push
